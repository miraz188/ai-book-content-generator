<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Book Content Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">📚 AI Book Content Generator</h1>

        <!-- Upload Section -->
        <div class="mb-8 p-6 border-2 border-dashed border-blue-300 rounded-lg bg-blue-50 text-center">
            <input type="file" id="bookFile" class="mb-4 block mx-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
            <button onclick="uploadFile()" id="btnText" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold hover:bg-blue-700 transition">Generate Content</button>

            <!-- Loader -->
            <div id="loader" class="hidden mt-4 mx-auto loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
            <p id="status" class="mt-2 text-gray-600 font-medium"></p>
        </div>

        <!-- Result Section -->
        <div id="results" class="hidden space-y-6">
            <div class="p-4 bg-green-50 rounded-lg border border-green-200">
                <h2 class="text-xl font-bold text-green-800 mb-2">🎬 YouTube Video Script</h2>
                <pre id="videoScript" class="whitespace-pre-wrap text-gray-700 bg-white p-3 rounded border text-sm"></pre>
            </div>

            <div class="p-4 bg-purple-50 rounded-lg border border-purple-200">
                <h2 class="text-xl font-bold text-purple-800 mb-2">📱 YouTube Shorts Ideas</h2>
                <pre id="shortsIdeas" class="whitespace-pre-wrap text-gray-700 bg-white p-3 rounded border text-sm"></pre>
            </div>

            <div class="p-4 bg-orange-50 rounded-lg border border-orange-200">
                <h2 class="text-xl font-bold text-orange-800 mb-2">📝 Summary (Bullet Points)</h2>
                <pre id="summary" class="whitespace-pre-wrap text-gray-700 bg-white p-3 rounded border text-sm"></pre>
            </div>
        </div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('bookFile');
            const status = document.getElementById('status');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const btn = document.getElementById('btnText');

            if (!fileInput.files[0]) {
                alert("Please select a file first!");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // Show Loader and Status
            status.innerText = "Processing with AI (Ollama)... Please wait 1-3 minutes.";
            loader.classList.remove('hidden');
            results.classList.add('hidden');
            btn.disabled = true;

            try {
                const response = await fetch('http://127.0.0.1:8000/upload-book/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('videoScript').innerText = data.video_script;
                    document.getElementById('shortsIdeas').innerText = data.shorts_ideas;
                    document.getElementById('summary').innerText = data.summary;

                    results.classList.remove('hidden');
                    status.innerText = "Success! Content Generated.";
                } else {
                    status.innerText = "Error: " + (data.detail || "Something went wrong.");
                }
            } catch (error) {
                status.innerText = "Error: Backend not running or Connection failed.";
                console.error(error);
            } finally {
                loader.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
